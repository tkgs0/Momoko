[project]
name = "MomokoBot"
version = "0.1.1"
description = "MomokoBot"
readme = "README.md"
requires-python = ">=3.10, <4.0"

[tool.nonebot]
adapters = [
    { name = "OneBot V11", module_name = "nonebot.adapters.onebot.v11" }
]
plugins = [
    "nonebot_plugin_system_command",
    "nonebot_plugin_blacklist",
    "nonebot_plugin_eavesdropper",
    # "nonebot_plugin_antiinsult",
    "nonebot_plugin_looklike",
    "nonebot_plugin_repesix",
]
plugin_dirs = [
    "basic_plugins",
    "plugins",
    "other_plugins"
]

[tool.poetry]
name = "MomokoBot"
version = "0.1.0"
description = "MomokoBot"
authors = ["月ヶ瀬"]
license = "GPL-3.0"
readme = "README.md"
homepage = "https://github.com/tkgs0/Momoko"
repository = "https://github.com/tkgs0/Momoko"
keywords = ["nonebot", "momoko", "qqbot"]

[tool.poetry.dependencies]
python = ">=3.10, <3.15"
nb-cli = ">=1.4.1"
nonebot2 = {extras = ["fastapi"], version = "^2.2.1"}
nonebot-adapter-onebot = "^2.4.3"
nonebot-plugin-antiinsult = ">=0.7.1"
nonebot-plugin-apscheduler = ">=0.4.0"
nonebot-plugin-blacklist = ">=1.4.2"
nonebot-plugin-eavesdropper = ">=0.0.11"
nonebot-plugin-looklike = ">=0.0.2"
nonebot-plugin-repesix =">=0.0.3"
nonebot-plugin-send-anything-anywhere = ">=0.6.1"
nonebot-plugin-system-command = ">=0.1.3"
aiofiles = ">=23.2.1"
aiohttp = {extras = ["speedups"], version = ">=3.9.4"}
arrow = ">=1.3.0"
binance-connector = ">=3.7.0"
dbutils = ">=3.1.0"
diro-py = ">=0.1.1"
emoji = ">=2.11.0"
langid = ">=1.1.6"
pil-utils = ">=0.1.10"
psutil = ">=5.9.8"
pydub = ">=0.25.1"
ujson = ">=5.9.0"

[tool.poetry.dev-dependencies]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
implicit_reexport = true
pretty = true
show_error_codes = true
strict = true

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

